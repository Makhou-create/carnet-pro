<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bleu:#2563eb;--vert:#0f9d6b;--orange:#ea6a0c;--rouge:#dc2626;--fond:#f5f7fb;--texte:#141b34;--gris:#6b7794;--bord:#e3e8f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--fond);color:var(--texte);padding-bottom:84px;font-size:15px}
main{padding:14px;max-width:640px;margin:auto}

/* ---------- En-tête (compact) ---------- */
header{background:rgba(245,247,251,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:8px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;box-shadow:0 6px 14px rgba(37,99,235,.3)}
header h1{margin:0;font-size:17px;letter-spacing:-.3px}header p{margin:0;color:var(--gris);font-size:12px}
.espace{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bord);border-radius:18px;padding:6px 11px;color:var(--texte);font:700 12px system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 6px rgba(20,27,52,.06)}
.espace i{width:7px;height:7px;border-radius:50%;background:var(--vert);box-shadow:0 0 0 3px rgba(15,157,107,.18)}
nav svg,.ico svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Bannière animée (compacte) ---------- */
.banner{position:relative;overflow:hidden;margin:-14px -14px 12px;padding:12px 16px 34px;min-height:128px;background:linear-gradient(135deg,#1e40af 0%,#2563eb 55%,#3b82f6 100%);border-radius:0 0 24px 24px;color:#fff;box-shadow:0 10px 22px rgba(37,99,235,.22)}
.banner .txt{position:relative;z-index:2;max-width:60%}
.banner .sub{font-size:13px;color:rgba(255,255,255,.88);margin:0}
.banner h2{font-size:24px;letter-spacing:-.5px;margin:6px 0 2px;color:#fff}
.date{display:inline-block;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:11px;padding:4px 9px;border-radius:16px}
.date::first-letter{text-transform:uppercase}
.anim{position:absolute;inset:0;width:100%;height:100%}
.anim *{transform-box:fill-box;transform-origin:center}
.anim .drift{animation:drift 7s ease-in-out infinite}
.anim .d2{animation-delay:-3s}.anim .d3{animation-delay:-5s;animation-duration:9s}
.anim .wv1{animation:slide 9s linear infinite}
.anim .wv2{animation:slide 14s linear infinite reverse}
.anim .book{transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.anim .ln{fill:none;stroke:#b9c8ee;stroke-width:3;stroke-linecap:round;stroke-dasharray:30;animation:write 5s ease-in-out infinite}
.anim .l2{animation-delay:.5s}.anim .l3{animation-delay:1s}.anim .l4{animation-delay:1.5s}
.anim .coin{animation:floaty 3s ease-in-out infinite}
.anim .c2{animation-delay:-1.4s}
.anim .spark{fill:none;stroke-width:2;stroke-linecap:round;animation:twinkle 2.4s ease-in-out infinite}
.anim .s2{animation-delay:-1.2s}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.6s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-6px)}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-196px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes write{0%{stroke-dashoffset:30}20%,80%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:30}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(16deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){.anim *,.wave{animation:none!important}}

/* ---------- Raccourcis (compacts) ---------- */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.quick button{background:#fff;border:1px solid var(--bord);border-radius:16px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px system-ui,sans-serif;color:var(--texte);cursor:pointer;box-shadow:0 3px 10px rgba(20,27,52,.05)}
.quick .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.quick .ico svg{width:17px;height:17px}
.q1{background:#e8efff;color:var(--bleu)}.q2{background:#fff1e3;color:var(--orange)}.q3{background:#e2f7ee;color:var(--vert)}

/* ---------- Tableau de bord en grille (compact) ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat{position:relative;overflow:hidden;border-radius:16px;padding:10px 12px;color:#fff;cursor:default}
.stat small{opacity:.92;font-size:11.5px;font-weight:600;display:block}
.stat>small{padding-right:30px}
.stat .n{font-size:21px;font-weight:800;letter-spacing:-.4px;margin:3px 0 1px;line-height:1.1}
.stat .n em{font-style:normal;font-size:11px;font-weight:700;opacity:.85;margin-left:3px}
.stat .ic{position:absolute;right:9px;top:9px;width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.stat .ic svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat .ic.dark{background:#eaf0ff}.stat .ic.dark svg{stroke:var(--bleu)}
.stat.tap{cursor:pointer}
.wide{grid-column:span 2}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .6s}
.s-blue{background:linear-gradient(135deg,#2563eb,#1e40af)}
.s-green{background:linear-gradient(135deg,#10b981,#047857)}
.s-orange{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.s-red{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.s-white{background:#fff;color:var(--texte);border:1px solid var(--bord)}
.s-white small{color:var(--gris);opacity:1}

/* ---------- Divers ---------- */
.kicker{color:var(--bleu);font-weight:800;letter-spacing:.12em;font-size:12px;margin:4px 0}
h2{margin:2px 0 8px;font-size:24px}
.sub{color:var(--gris);margin:0 0 10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;background:var(--bleu);color:#fff;cursor:pointer}
.btn.sec{background:#eaf0ff;color:var(--bleu)}.btn.red{background:#fee2e2;color:var(--rouge)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.box{background:#fff;border:1px solid var(--bord);border-radius:18px;padding:12px;margin:10px 0}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.box h3{margin:0;font-size:18px}
.box .sub{font-size:13px}
.link{color:var(--bleu);font-weight:800;cursor:pointer;font-size:14px;white-space:nowrap}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bord);border-radius:12px;font-size:16px;background:#f8f9fd;margin:5px 0 8px;font-family:inherit}
label{font-size:12.5px;font-weight:700;color:var(--gris)}
.chips{display:flex;gap:8px;margin:-2px 0 10px;flex-wrap:wrap}
.chips button{border:1px solid var(--bord);background:#fff;border-radius:18px;padding:6px 11px;font-weight:700;font-size:12.5px;color:var(--bleu);cursor:pointer}
.cl{border:1px solid var(--bord);border-left:4px solid var(--bleu);border-radius:15px;padding:10px;margin:8px 0;background:#fff}
.cl.ok{border-left-color:var(--vert)}
.cl.late-c{border-left-color:var(--rouge)}
.cl-top{display:flex;gap:10px;align-items:center;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.cl.ok .av{background:linear-gradient(135deg,#10b981,#047857)}
.cl.late-c .av{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.cl-info{flex:1;min-width:0}.cl-info b{display:block;font-size:15px}.cl-info span{color:var(--gris);font-size:13px}
.rest{text-align:right;font-weight:800;color:var(--orange);font-size:15px;line-height:1.25}
.cl.ok .rest{color:var(--vert)}.cl.late-c .rest{color:var(--rouge)}
.badge{display:inline-block;background:#fef0cc;color:#b45309;border-radius:16px;padding:2px 8px;font-size:11px;font-weight:700}
.badge.red{background:#fee2e2;color:#b91c1c}.badge.green{background:#d9f5e8;color:#0b7a53}
.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:612px;margin:auto;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(227,232,242,.9);border-radius:22px;box-shadow:0 8px 24px rgba(20,27,52,.15);display:flex;gap:4px;padding:4px;z-index:6}
nav button{flex:1;border:0;background:none;padding:6px 4px 5px;border-radius:18px;color:var(--gris);font:700 11px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:background .2s,color .2s}
nav button svg{width:20px;height:20px}
nav button.on{background:var(--bleu);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.32)}
.modal{position:fixed;inset:0;background:rgba(10,15,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:16px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bord);font-size:14.5px}
.row small{color:var(--gris);display:block;font-size:12.5px}
.row.tap{cursor:pointer}
.plus{color:var(--orange);font-weight:700}.moins{color:var(--vert);font-weight:700}.late{color:var(--rouge);font-weight:800}
.alerte{background:#fee2e2;color:#b91c1c;border-radius:12px;padding:8px 11px;font-weight:700;font-size:13.5px;margin:8px 0}
.hint{color:var(--gris);font-size:12px;margin:8px 0 2px}
.vide{color:var(--gris);text-align:center;padding:14px;font-size:14px}
.auth{max-width:420px;margin:50px auto;padding:20px}
.msg{color:var(--rouge);font-size:14px;min-height:20px}.msg.ok{color:var(--vert)}
.mode{background:#fff7e0;color:#92400e;font-size:11px;text-align:center;padding:4px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#141b34;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:30;display:none}
</style>

<body>

<!-- ============ CONFIGURATION SUPABASE ============ -->
<script>
// Collez ici vos deux valeurs (Supabase > Project Settings > API)
// Laissez vide pour tester en MODE LOCAL (données gardées dans le téléphone)
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
</script>

<div id="app"></div>
<div class="modal" id="modal" onclick="if(event.target===this)fermer()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ============ OUTILS ============ */
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat('fr-FR').format(Math.round(n||0)).replace(/[  ]/g,' ');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initiales = n => n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const datefr = d => new Date(d).toLocaleDateString('fr-FR');
const dateSimple = d => String(d).slice(0,10).split('-').reverse().join('/');   // 2026-11-05 -> 05/11/2026
const dateISO = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const aujourdhui = () => dateISO(new Date());
const joursEntre = (a,b) => Math.round((new Date(b)-new Date(a))/864e5);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500);}
function telecharger(nom,contenu,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([contenu],{type}));
  a.download=nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ============ COUCHE DONNÉES ============
   Mêmes fonctions pour Supabase et pour le mode local. */
const MODE_LOCAL = !SUPABASE_URL || !SUPABASE_ANON_KEY;
const RECUP = location.hash.includes('type=recovery');   // arrivée par le lien « mot de passe oublié »
let sb = null, user = null;
if(!MODE_LOCAL){
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(evt => { if(evt==='PASSWORD_RECOVERY') ecranNouveauMdp(); });
}
const lire = t => JSON.parse(localStorage.getItem('cp_'+t)||'[]');
const ecrire = (t,l) => localStorage.setItem('cp_'+t,JSON.stringify(l));

const DB = {
  async liste(table){
    if(MODE_LOCAL) return lire(table);
    const {data,error} = await sb.from(table).select('*').order('created_at',{ascending:false});
    if(error) throw error; return data;
  },
  async ajouter(table,ligne){
    if(MODE_LOCAL){
      const l = lire(table);
      const nv = {id:crypto.randomUUID(),created_at:new Date().toISOString(),...ligne};
      l.unshift(nv); ecrire(table,l); return nv;
    }
    const {data,error} = await sb.from(table).insert(ligne).select().single();
    if(error) throw error; return data;
  },
  async modifier(table,id,patch){
    if(MODE_LOCAL){ ecrire(table,lire(table).map(x=>x.id===id?{...x,...patch}:x)); return; }
    const {error} = await sb.from(table).update(patch).eq('id',id);
    if(error) throw error;
  },
  async supprimer(table,id){
    if(MODE_LOCAL){ ecrire(table,lire(table).filter(x=>x.id!==id)); return; }
    const {error} = await sb.from(table).delete().eq('id',id);
    if(error) throw error;
  }
};

/* ============ ÉTAT ET CALCULS ============ */
let S = {clients:[],credits:[],paiements:[],page:'accueil',recherche:''};

async function charger(){
  try{
    const [c,cr,p] = await Promise.all([DB.liste('clients'),DB.liste('credits'),DB.liste('payments')]);
    S.clients=c; S.credits=cr; S.paiements=p;
  }catch(e){ toast('Erreur : '+(e.message||e)); console.error(e); }
  afficher();
}
const totalCredits = id => S.credits.filter(x=>!id||x.client_id===id).reduce((a,x)=>a+Number(x.amount),0);
const totalPaye = id => S.paiements.filter(x=>!id||x.client_id===id).reduce((a,x)=>a+Number(x.amount),0);
const reste = id => totalCredits(id)-totalPaye(id);

/* Retard d'un client : les paiements remboursent d'abord les plus anciens crédits (méthode FIFO).
   Ce qui reste dû sur un crédit dont l'échéance est passée = montant en retard. */
function enRetard(cid){
  const t = aujourdhui();
  let paye = totalPaye(cid), du = 0, depuis = null;
  const cr = S.credits.filter(x=>x.client_id===cid).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  for(const c of cr){
    const part = Math.min(paye, Number(c.amount)); paye -= part;
    const encore = Number(c.amount)-part;
    if(encore>0 && c.due_date && c.due_date<t){
      du += encore;
      if(!depuis || c.due_date<depuis) depuis = c.due_date;
    }
  }
  return du>0 ? {montant:du, depuis, jours:joursEntre(depuis,t)} : null;
}
const retards = () => S.clients.map(c=>({c,r:enRetard(c.id)})).filter(x=>x.r).sort((a,b)=>b.r.jours-a.r.jours);

/* ============ AUTHENTIFICATION ============ */
async function demarrer(){
  if(MODE_LOCAL){ await charger(); return; }
  if(RECUP){ ecranNouveauMdp(); return; }
  const {data} = await sb.auth.getSession();
  user = data.session?.user || null;
  user ? charger() : ecranConnexion();
}
function ecranConnexion(msg=''){
  $('#app').innerHTML = `<div class="auth">
    <div class="logo" style="margin-bottom:14px">C</div>
    <h2>Carnet Pro</h2><p class="sub">Connectez-vous pour accéder à vos crédits.</p>
    <label>Email</label><input id="em" type="email" autocomplete="email">
    <label>Mot de passe (6 caractères minimum)</label><input id="pw" type="password" autocomplete="current-password">
    <div class="msg" id="am">${esc(msg)}</div>
    <button class="btn" style="width:100%" onclick="connexion()">Se connecter</button>
    <button class="btn sec" style="width:100%;margin-top:10px" onclick="inscription()">Créer un compte</button>
    <p style="text-align:center;margin-top:14px"><a class="link" style="font-size:14px" onclick="mdpOublie()">Mot de passe oublié ?</a></p></div>`;
}
async function connexion(){
  const {data,error} = await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error) return $('#am').textContent = error.message;
  user = data.user; charger();
}
async function inscription(){
  const {data,error} = await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value});
  if(error) return $('#am').textContent = error.message;
  if(data.session){ user=data.user; charger(); }
  else $('#am').textContent = "Compte créé. Vérifiez votre email puis connectez-vous.";
}
async function mdpOublie(){
  const email=$('#em').value.trim(), m=$('#am');
  m.classList.remove('ok');
  if(!email) return m.textContent='Entrez d’abord votre email ci-dessus.';
  const {error} = await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error) return m.textContent=error.message;
  m.classList.add('ok'); m.textContent='Email envoyé : ouvrez le lien reçu pour choisir un nouveau mot de passe.';
}
function ecranNouveauMdp(){
  $('#app').innerHTML = `<div class="auth">
    <div class="logo" style="margin-bottom:14px">C</div>
    <h2>Nouveau mot de passe</h2><p class="sub">Choisissez un nouveau mot de passe.</p>
    <label>Nouveau mot de passe (6 caractères minimum)</label><input id="np" type="password" autocomplete="new-password">
    <div class="msg" id="am"></div>
    <button class="btn" style="width:100%" onclick="saveNouveauMdp()">Enregistrer</button></div>`;
}
async function saveNouveauMdp(){
  const pw=$('#np').value;
  if(pw.length<6) return $('#am').textContent='6 caractères minimum';
  const {data,error} = await sb.auth.updateUser({password:pw});
  if(error) return $('#am').textContent=error.message;
  history.replaceState(null,'',location.pathname);
  user=data.user; toast('Mot de passe changé'); charger();
}
async function deconnexion(){
  fermer();
  if(MODE_LOCAL) return toast('Mode local : pas de compte');
  await sb.auth.signOut(); user=null; ecranConnexion();
}

/* ============ MON ESPACE : sauvegarde et export ============ */
function ecranEspace(){
  ouvrir(`<h3>Mon espace</h3>
    <p class="sub">${MODE_LOCAL?'Mode local : les données restent sur ce téléphone. Faites une sauvegarde de temps en temps.':esc(user?user.email:'')}</p>
    <div style="display:grid;gap:8px">
      <button class="btn sec" onclick="exporterJSON()">Télécharger une sauvegarde</button>
      <button class="btn sec" onclick="exporterCSV()">Exporter les clients (Excel)</button>
      ${MODE_LOCAL
        ? `<label class="btn sec" style="text-align:center;margin:0;font-size:15px;color:var(--bleu)">Restaurer une sauvegarde<input type="file" accept=".json,application/json" hidden onchange="importer(this)"></label>`
        : `<button class="btn red" onclick="deconnexion()">Se déconnecter</button>`}
      <button class="btn sec" onclick="fermer()">Fermer</button>
    </div>`);
}
function exporterJSON(){
  telecharger('carnet-pro-sauvegarde-'+aujourdhui()+'.json',
    JSON.stringify({app:'carnet-pro',version:1,date:new Date().toISOString(),clients:S.clients,credits:S.credits,payments:S.paiements},null,1),
    'application/json');
  toast('Sauvegarde téléchargée');
}
function exporterCSV(){
  const lignes=[['Client','Téléphone','Total crédits','Total payé','Reste à payer','Retard']];
  S.clients.forEach(c=>{const r=enRetard(c.id); lignes.push([c.name,c.phone||'',totalCredits(c.id),totalPaye(c.id),reste(c.id),r?r.montant:0]);});
  const csv='﻿'+lignes.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  telecharger('carnet-pro-clients-'+aujourdhui()+'.csv',csv,'text/csv;charset=utf-8');
  toast('Fichier Excel téléchargé');
}
function importer(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.clients)||!Array.isArray(d.credits)||!Array.isArray(d.payments)) throw new Error('invalide');
      if(!confirm('Remplacer toutes les données de ce téléphone par cette sauvegarde ?')) return;
      ecrire('clients',d.clients); ecrire('credits',d.credits); ecrire('payments',d.payments);
      fermer(); charger(); toast('Sauvegarde restaurée');
    }catch(e){ toast('Fichier invalide'); }
  };
  r.readAsText(f);
}

/* Une ligne d'historique (crédit ou paiement). Touchez-la pour modifier ou supprimer. */
function ligneMouv(m,nom){
  const credit = m.t==='credit';
  const lib = credit ? esc(m.note||'Crédit') : 'Paiement · '+esc(m.method||'Espèces');
  const ech = credit && m.due_date ? ` · échéance ${dateSimple(m.due_date)}` : '';
  const haut = nom ? `<b>${esc(nom)}</b>` : lib;
  const bas = nom ? `${datefr(m.created_at)} · ${lib}${ech}` : `${datefr(m.created_at)}${ech}`;
  return `<div class="row tap" onclick="ouvrirOp('${m.t}','${m.id}')"><div>${haut}<small>${bas}</small></div>
    <span class="${credit?'plus':'moins'}">${credit?'+':'−'}${fmt(m.amount)} F</span></div>`;
}

function ecranRecu(p){
  const c=S.clients.find(x=>x.id===p.client_id);
  ouvrir(`<h3>✓ Paiement enregistré</h3>
    <div class="row"><span>${esc(c?c.name:'')}</span><b class="moins">${fmt(p.amount)} F</b></div>

    <button class="btn" style="width:100%;margin-top:12px" onclick="envoyerRecu('${p.id}')">Envoyer le reçu par WhatsApp</button>
    <button class="btn sec" style="width:100%;margin-top:8px" onclick="fermer()">Fermer</button>`);
}
/* Reste à payer au moment d'un paiement donné (un ancien reçu reste exact) */
function resteAu(p){
  const t=new Date(p.created_at), id=p.client_id;
  const cr=S.credits.filter(x=>x.client_id===id&&new Date(x.created_at)<=t).reduce((a,x)=>a+Number(x.amount),0);
  const pa=S.paiements.filter(x=>x.client_id===id&&new Date(x.created_at)<=t).reduce((a,x)=>a+Number(x.amount),0);
  return cr-pa;
}

/* ---- Modifier / supprimer une opération ---- */
const tableDe = type => type==='credit' ? 'credits' : 'payments';
const trouverOp = (type,id) => (type==='credit'?S.credits:S.paiements).find(x=>x.id===id);
function ouvrirOp(type,id){
  const m=trouverOp(type,id); if(!m) return;
  const c=S.clients.find(x=>x.id===m.client_id), credit=type==='credit';
  ouvrir(`<h3>${credit?'Crédit':'Paiement'} · ${esc(c?c.name:'')}</h3>
    <div class="row"><span>Montant</span><b>${fmt(m.amount)} F</b></div>
    <div class="row"><span>Date</span><b>${datefr(m.created_at)}</b></div>
    ${credit?`<div class="row"><span>Échéance</span><b>${m.due_date?dateSimple(m.due_date):'—'}</b></div>${m.note?`<div class="row"><span>Note</span><b>${esc(m.note)}</b></div>`:''}`
            :`<div class="row"><span>Moyen</span><b>${esc(m.method||'Espèces')}</b></div>`}
    <div style="display:grid;gap:8px;margin-top:12px">
      ${credit?'':`<button class="btn" onclick="envoyerRecu('${m.id}')">Envoyer le reçu par WhatsApp</button>`}

      <button class="btn sec" onclick="fermer()">Fermer</button>
    </div>`);
}
function formEdit(type,id){
  const m=trouverOp(type,id); if(!m) return;
  ouvrir(type==='credit'
    ? `<h3>Modifier le crédit</h3>
       <label>Montant (FCFA)</label><input id="e_mt" type="number" inputmode="numeric" value="${m.amount}">
       <label>Note</label><input id="e_note" value="${esc(m.note||'')}">
       <label>Échéance</label><input id="e_ech" type="date" value="${m.due_date?String(m.due_date).slice(0,10):''}">
       <button class="btn" style="width:100%" onclick="saveEdit('credit','${id}')">Enregistrer</button>`
    : `<h3>Modifier le paiement</h3>
       <label>Montant (FCFA)</label><input id="e_mt" type="number" inputmode="numeric" value="${m.amount}">
       <label>Moyen de paiement</label><select id="e_mode">${optionsMoyen(m.method||'Espèces')}</select>
       <button class="btn" style="width:100%" onclick="saveEdit('paiement','${id}')">Enregistrer</button>`);

async function saveEdit(type,id){
  const m=trouverOp(type,id); if(!m) return;
  const amount=Number($('#e_mt').value);
  if(!(amount>0)) return toast('Montant invalide');
  const patch = type==='credit'
    ? {amount,note:$('#e_note').value.trim(),due_date:$('#e_ech').value||null}
    : {amount,method:$('#e_mode').value};
  try{ await DB.modifier(tableDe(type),id,patch); await charger(); toast('Modifié'); detailClient(m.client_id); }
  catch(e){ toast('Erreur : '+e.message); }
}
async function supprOp(type,id){
  const m=trouverOp(type,id); if(!m) return;
  if(!confirm('Supprimer cette opération ?')) return;
  try{ await DB.supprimer(tableDe(type),id); await charger(); toast('Supprimé'); detailClient(m.client_id); }
  catch(e){ toast('Erreur : '+e.message); }
}

/* ============ WHATSAPP ============ */
function ouvrirWA(phone,msg){
  let tel=(phone||'').replace(/\D/g,'');
  if(!tel) return toast('Pas de numéro pour ce client');
  if(tel.length===9) tel='221'+tel;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
}
function whatsapp(id){
  const c=S.clients.find(x=>x.id===id); if(!c) return;
  const r=reste(id);
  ouvrirWA(c.phone, r>0
    ? `Bonjour ${c.name}, petit rappel : il vous reste ${fmt(r)} FCFA à rembourser. Merci !`
    : `Bonjour ${c.name}, votre compte est soldé. Merci pour votre confiance !`);
}
function relancer(id){
  const c=S.clients.find(x=>x.id===id); if(!c) return;
  const r=enRetard(id);
  if(!r) return toast('Ce client n’est pas en retard');
  ouvrirWA(c.phone,`Bonjour ${c.name}, petit rappel : ${fmt(r.montant)} FCFA étaient à régler le ${dateSimple(r.depuis)} (${r.jours} jour${r.jours>1?'s':''} de retard). Reste total à payer : ${fmt(reste(id))} FCFA. Merci de régulariser dès que possible.`);
}
function envoyerRecu(pid){
  const p=S.paiements.find(x=>x.id===pid); if(!p) return;
  const c=S.clients.find(x=>x.id===p.client_id); if(!c) return;
  const r=resteAu(p);
  ouvrirWA(c.phone,`🧾 *REÇU DE PAIEMENT* n° ${p.id.slice(0,6).toUpperCase()}\n\nClient : ${c.name}\nMontant reçu : ${fmt(p.amount)} FCFA\nMoyen : ${p.method||'Espèces'}\nDate : ${datefr(p.created_at)}\nReste à payer : ${fmt(Math.max(r,0))} FCFA\n\n${r<=0?'Votre compte est soldé. ':''}Merci pour votre confiance !`);
}

demarrer();
</script>
